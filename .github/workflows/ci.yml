name: Validate workbench
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: workbench
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: testing-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workbench" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      WB_DATABASE_URL: postgresql+psycopg://workbench:testing-only@localhost:5432/workbench
      TEST_DATABASE_URL: postgresql+psycopg://workbench:testing-only@localhost:5432/workbench
      TEST_BACKUP_DATABASE_URL: postgresql+psycopg://workbench:testing-only@localhost:5432/workbench
      WB_API_TOKEN: ci-only-token-at-least-32-characters-long
      WB_EFM_PASSWORD: ci-only-password-at-least-twelve
      WB_STORAGE_ROOT: /tmp/workbench-ci
      WB_PUBLIC_ORIGIN: http://localhost:3000
      WB_REQUIRE_LOGIN: '1'
      WB_LOGIN_USERNAME: ci-user
      WB_LOGIN_PASSWORD: ci-only-private-workspace-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -c backend/constraints.txt -e 'backend[dev]'
      - run: pip check
      - name: PostgreSQL 16 clients for isolated backup/restore drills
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: python scripts/check_scientific_surface.py
      - run: python -m workbench.config
      - run: alembic -c backend/alembic.ini upgrade head
      - name: Source-pinned scientific integration and backend regressions
        run: python scripts/check_scientific_integration.py --all
      - run: python scripts/export_schemas.py --check
      - name: Deterministic autonomy evaluation and measured trajectories
        run: python scripts/check_agent_evaluation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-evaluation
          path: outputs/e15/report.json
      - run: npm ci && npm run contracts:check && npm run test:contracts && npm run test:boundary && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          python -m workbench.serve > /tmp/runtime.log 2>&1 &
          npm --prefix frontend run start > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/healthz >/dev/null && break || sleep 1; done
          npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: |
            frontend/test-results
            /tmp/runtime.log
            /tmp/web.log
  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: compose-test-password
      WB_API_TOKEN: compose-test-token-at-least-32-characters
      WB_EFM_PASSWORD: compose-test-failure-memory-password
      WB_LOGIN_PASSWORD: compose-test-private-workspace-password
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_compose.py
      - run: docker compose up --build -d --wait
      - name: Verify repeatable setup and unconfigured agent rejection
        run: |
          docker compose stop web api worker
          docker compose run --rm setup
          docker compose up -d --wait
          set +e
          docker compose run --rm --no-deps -e WB_AGENTS_ENABLED=1 -e WB_COORDINATOR_MODEL=ci-model -e WB_SPECIALIST_MODEL=ci-model -e ANTHROPIC_API_KEY=ci-only-canary agent-worker > /tmp/agent-startup.log 2>&1
          status=$?
          set -e
          test "$status" = "2"
          grep -q 'WB_AGENT_MODEL_BOUNDS' /tmp/agent-startup.log
          ! grep -q 'ci-only-canary' /tmp/agent-startup.log
      - run: |
          curl --fail http://localhost:3000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "401"
          curl --fail -u "workbench:$WB_LOGIN_PASSWORD" http://localhost:3000/
      - if: always()
        run: docker compose logs --no-color && docker compose down -v
